repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check --fix
        entry: uv run --locked --no-sync python -m ruff check --fix
        language: system
        types_or:
          - python
          - pyi

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --no-sync python -m ruff format
        language: system
        types_or:
          - python
          - pyi
